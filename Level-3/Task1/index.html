<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Image Gallery</title>

<link rel="stylesheet" href="style.css">
```

</head>
<body>

```
<header>
    <h1>My Image Gallery</h1>
    <p>Explore beautiful images in one place.</p>
</header>

<!-- Automatic Slideshow -->
<section class="slideshow">
    <img id="slideshowImage" src="images/image1.jpg" alt="Slideshow image">
</section>

<!-- Image Gallery -->
<h2>Gallery</h2>

<section class="gallery">
    <img src="images/image1.jpg" alt="Gallery image 1" onclick="openImage(this)">
    <img src="images/image2.jpg" alt="Gallery image 2" onclick="openImage(this)">
    <img src="images/image3.jpg" alt="Gallery image 3" onclick="openImage(this)">
    <img src="images/image4.jpg" alt="Gallery image 4" onclick="openImage(this)">
</section>

<!-- Enlarged Image View -->
<div id="imageModal" class="modal" onclick="closeImage()">
    <span class="close">&times;</span>
    <img id="enlargedImage" alt="Enlarged gallery image">
</div>

<script src="script.js"></script>
```

</body>
</html>
